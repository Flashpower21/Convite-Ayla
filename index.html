<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Convite Ayla Valentina</title>
    <style>
        /* Reset geral e centralização no PC */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            font-family: 'Arial Rounded MT Bold', 'Nunito', 'Comic Sans MS', sans-serif;
            background-color: #F8EAFB;
            overflow: hidden; 
            display: flex;
            justify-content: center; 
        }

        /* Container principal simulando a tela do celular */
        .container {
            height: 100vh;
            height: 100dvh; 
            width: 100%;
            max-width: 450px; 
            background-color: #F8EAFB;
            scroll-snap-type: y mandatory;
            overflow-y: scroll;
            -webkit-overflow-scrolling: touch; 
            box-shadow: 0 0 15px rgba(0,0,0,0.1); 
            
            /* Ocultar barra de rolagem */
            -ms-overflow-style: none;  
            scrollbar-width: none;  
        }

        .container::-webkit-scrollbar {
            display: none;
        }

        /* Configuração das telas */
        .tela {
            height: 100vh; 
            height: 100dvh; 
            width: 100%;
            background-size: contain; 
            background-position: center; 
            background-repeat: no-repeat;
            scroll-snap-align: start; 
            position: relative;
            background-color: #F8EAFB; 
        }

        /* TELA 1: Mantém o fundo original e prepara o espaço do vídeo */
        .tela-1 {
            background-image: url('Ayla.png'); /* Sua imagem de fundo volta pra cá */
            display: flex;
            justify-content: center;
            align-items: center; /* Centraliza */
            padding-bottom: 25%; /* Empurra a caixa do vídeo um pouco mais para cima na tela */
        }

        /* Caixa onde o vídeo vai rodar flutuando sobre a imagem */
        .caixa-video {
            width: 75%; /* Ocupa 75% da largura da tela do celular */
            max-width: 300px;
            background-color: #000; /* Fundo escuro caso o vídeo demore a carregar */
            border: 4px solid #FFFFFF; /* Borda branca estilosa */
            border-radius: 15px; /* Bordas arredondadas */
            box-shadow: 0 10px 25px rgba(0,0,0,0.25); /* Sombra para dar destaque */
            overflow: hidden; /* Faz o vídeo respeitar o formato arredondado da borda */
            z-index: 10;
        }

        .caixa-video video {
            width: 100%;
            display: block; /* Tira margens em branco indesejadas */
            object-fit: cover;
        }

        /* TELA 2: Fundo da segunda página */
        .tela-2 {
            background-image: url('fundo.png');
            display: flex;
            flex-direction: column;
            justify-content: center; 
            align-items: center;
            gap: 22px; 
        }

        /* Estilos dos Botões Interativos */
        .botao {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 85%; 
            max-width: 320px;
            padding: 14px 18px; 
            text-decoration: none;
            font-size: 18px; 
            font-weight: 900; 
            color: #FFFFFF; 
            text-shadow: 1px 2px 4px rgba(0,0,0,0.3); 
            border-radius: 50px; 
            transition: transform 0.1s ease-in-out;
            text-align: center;
            white-space: nowrap; 
            -webkit-tap-highlight-color: transparent; 
            box-sizing: border-box; 
            cursor: pointer;
        }

        .botao:active {
            transform: scale(0.95);
        }

        /* Botões Específicos */
        .botao-mapa {
            background: linear-gradient(180deg, #FDE274 0%, #F4C042 100%); 
            border: 3px solid #E5AF2B;
            box-shadow: inset 0px 4px 0px rgba(255, 255, 255, 0.5), 0 6px 15px rgba(0,0,0,0.15); 
        }

        .botao-presenca {
            background: linear-gradient(180deg, #94CEF6 0%, #68A7D8 100%); 
            border: 3px solid #5896C7;
            box-shadow: inset 0px 4px 0px rgba(255, 255, 255, 0.5), 0 6px 15px rgba(0,0,0,0.15);
        }

        .botao-presentes {
            background: linear-gradient(180deg, #F8A9CD 0%, #E381B1 100%); 
            border: 3px solid #D16B9E;
            box-shadow: inset 0px 4px 0px rgba(255, 255, 255, 0.5), 0 6px 15px rgba(0,0,0,0.15);
        }

        /* =========================================
           BOTÃO FLUTUANTE DE SOM DO VÍDEO
           ========================================= */
        .btn-som {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 50px;
            height: 50px;
            background: linear-gradient(180deg, #F8A9CD 0%, #E381B1 100%);
            border: 2px solid #D16B9E;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: white;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            z-index: 1000;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        @keyframes pulsar {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(227, 129, 177, 0.7); }
            70% { transform: scale(1.1); box-shadow: 0 0 0 10px rgba(227, 129, 177, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(227, 129, 177, 0); }
        }

        /* =========================================
           TELA POP-UP DE PRESENTES
           ========================================= */
        .tela-pop-up {
            display: none; 
            position: fixed; 
            top: 0;
            left: 50%;
            transform: translateX(-50%); 
            width: 100%;
            max-width: 450px; 
            height: 100vh;
            height: 100dvh; 
            background-color: #F8EAFB;
            background-image: url('presentes.png');
            background-size: contain;
            background-position: center;
            background-repeat: no-repeat;
            z-index: 999; 
            flex-direction: column;
            justify-content: space-between; 
            align-items: center;
            padding: 30px 20px 40px 20px; 
            box-sizing: border-box;
            box-shadow: 0 0 20px rgba(0,0,0,0.3);
            overflow-y: auto;
        }

        .titulo-presentes {
            font-size: 24px;
            font-weight: 900;
            color: #D16B9E;
            text-shadow: 1px 1px 2px rgba(255,255,255,0.8);
            text-align: center;
            margin-top: 15px;
        }

        .opcoes-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            align-items: center;
            margin: auto 0; 
        }

        .item-sugestao {
            background: rgba(255, 255, 255, 0.85);
            border: 2px dashed #E381B1;
            border-radius: 20px;
            padding: 12px 20px;
            width: 90%;
            max-width: 320px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
            box-sizing: border-box;
        }

        .item-sugestao h3 {
            margin: 0 0 5px 0;
            color: #7A5230;
            font-size: 16px;
        }

        .item-sugestao p {
            margin: 0;
            color: #555555;
            font-size: 14px;
            font-weight: bold;
        }

        .bloco-pix {
            background: rgba(255, 255, 255, 0.9);
            border: 2px solid #94CEF6;
            border-radius: 20px;
            padding: 12px;
            width: 90%;
            max-width: 320px;
            text-align: center;
            box-sizing: border-box;
        }

        .bloco-pix h3 {
            margin: 0 0 8px 0;
            color: #3A6B8C;
            font-size: 16px;
        }

        .qrcode-img {
            width: 110px;
            height: 110px;
            object-fit: contain;
            background-color: #FFF;
            border: 1px solid #ddd;
            border-radius: 10px;
            margin: 5px 0;
        }

        .chave-pix {
            font-size: 11px;
            color: #666;
            word-break: break-all;
            margin-top: 5px;
        }

        .botao-voltar {
            background: linear-gradient(180deg, #FFFFFF 0%, #F0F0F0 100%);
            border: 3px solid #D0D0D0;
            color: #777777;
            text-shadow: none;
            box-shadow: inset 0px 4px 0px rgba(255, 255, 255, 0.8), 0 6px 15px rgba(0,0,0,0.15);
            width: 60%;
            max-width: 250px;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <!-- BOTÃO FLUTUANTE DE SOM -->
    <div class="btn-som" id="btnSom" onclick="alternarSom()">
        🔇
    </div>

    <div class="container" id="areaPrincipal">
        
        <!-- TELA 1: FUNDO COM A CAIXA DE VÍDEO SOBREPOSTA -->
        <div class="tela tela-1">
            <div class="caixa-video">
                <!-- autoplay = toca sozinho | loop = repete | muted = sem som (exigência do celular) | playsinline = não abre em tela cheia no iOS -->
                <video id="videoConvite" autoplay loop muted playsinline>
                    <source src="video.mp4" type="video/mp4">
                    Seu navegador não suporta vídeos.
                </video>
            </div>
        </div>

        <!-- TELA 2: BOTÕES E INTERAÇÕES -->
        <div class="tela tela-2">
            <a href="LINK_DO_MAPA" target="_blank" class="botao botao-mapa">
                Como Chegar
            </a>

            <a href="LINK_DO_WHATSAPP" target="_blank" class="botao botao-presenca">
                Confirmar Presença
            </a>

            <a href="#" onclick="abrirPresentes(event)" class="botao-presentes botao">
                Lista de Presentes
            </a>
        </div>
    </div>

    <!-- TELA POP-UP DE PRESENTES -->
    <div class="tela-pop-up" id="telaPresentes">
        <div class="titulo-presentes">✨ Sugestão de Presentes ✨</div>

        <div class="opcoes-container">
            <div class="item-sugestao">
                <h3>👗 Roupinhas</h3>
                <p>Tamanho: 1 a 3 meses</p>
            </div>

            <div class="item-sugestao">
                <h3>👟 Calçados</h3>
                <p>Tamanho: 14 / 15</p>
            </div>

            <div class="bloco-pix">
                <h3>🎁 Presente via Pix</h3>
                <img src="qrcode.png" alt="QR Code Pix" class="qrcode-img">
                <div class="chave-pix">Chave Pix: seu-email@exemplo.com</div>
            </div>
        </div>

        <a href="#" onclick="fecharPresentes(event)" class="botao botao-voltar">
            ⬅️ Voltar
        </a>
    </div>

    <!-- SCRIPTS -->
    <script>
        // Lógica de presentes
        function abrirPresentes(event) {
            event.preventDefault(); 
            document.getElementById('telaPresentes').style.display = 'flex'; 
        }

        function fecharPresentes(event) {
            event.preventDefault(); 
            document.getElementById('telaPresentes').style.display = 'none'; 
        }

        // Lógica do Som do Vídeo
        const video = document.getElementById("videoConvite");
        const btnSom = document.getElementById("btnSom");

        function alternarSom() {
            if (video.muted) {
                video.muted = false; // Liga o som
                btnSom.innerHTML = "🔊"; // Ícone com som
                btnSom.style.animation = "pulsar 2s infinite"; // Adiciona o efeito visual de pulsar
            } else {
                video.muted = true; // Desliga o som
                btnSom.innerHTML = "🔇"; // Ícone sem som
                btnSom.style.animation = "none"; // Para a animação
            }
        }
    </script>

</body>
</html>
