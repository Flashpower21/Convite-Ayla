<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Convite Ayla Valentina</title>
    <style>
        /* Reset geral e centralização no PC */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            font-family: 'Arial Rounded MT Bold', 'Nunito', 'Comic Sans MS', sans-serif;
            background-color: #F8EAFB;
            display: flex;
            justify-content: center; 
        }

        /* Container principal simulando a tela do celular com rolagem livre */
        .container {
            width: 100%;
            max-width: 450px; 
            background-color: #F8EAFB;
            box-shadow: 0 0 15px rgba(0,0,0,0.1); 
            display: flex;
            flex-direction: column;
        }

        /* Seção do Vídeo no Topo (Preenchendo 100% da largura de ponta a ponta) */
        .secao-video {
            width: 100%;
            background-color: #000;
            line-height: 0; 
        }

        .secao-video video {
            width: 100%;
            height: auto;
            display: block; 
            object-fit: cover;
        }

        /* Seção da Imagem do Convite (Ayla.png) */
        .secao-imagem {
            width: 100%;
            aspect-ratio: 9 / 16; 
            background-image: url('Ayla.png');
            background-size: cover; 
            background-position: center; 
            background-repeat: no-repeat;
        }

        /* Seção 2: Botões e Interações */
        .secao-botoes {
            width: 100%;
            aspect-ratio: 9 / 16;
            background-image: url('fundo.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            display: flex;
            flex-direction: column;
            justify-content: center; 
            align-items: center;
            gap: 22px; 
        }

        /* Estilos dos Botões Interativos */
        .botao {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 85%; 
            max-width: 320px;
            padding: 14px 18px; 
            text-decoration: none;
            font-size: 18px; 
            font-weight: 900; 
            color: #FFFFFF; 
            text-shadow: 1px 2px 4px rgba(0,0,0,0.3); 
            border-radius: 50px; 
            transition: transform 0.1s ease-in-out;
            text-align: center;
            white-space: nowrap; 
            -webkit-tap-highlight-color: transparent; 
            box-sizing: border-box; 
            cursor: pointer;
        }

        .botao:active {
            transform: scale(0.95);
        }

        /* Botões Específicos */
        .botao-mapa {
            background: linear-gradient(180deg, #FDE274 0%, #F4C042 100%); 
            border: 3px solid #E5AF2B;
            box-shadow: inset 0px 4px 0px rgba(255, 255, 255, 0.5), 0 6px 15px rgba(0,0,0,0.15); 
        }

        .botao-presenca {
            background: linear-gradient(180deg, #94CEF6 0%, #68A7D8 100%); 
            border: 3px solid #5896C7;
            box-shadow: inset 0px 4px 0px rgba(255, 255, 255, 0.5), 0 6px 15px rgba(0,0,0,0.15);
        }

        .botao-presentes {
            background: linear-gradient(180deg, #F8A9CD 0%, #E381B1 100%); 
            border: 3px solid #D16B9E;
            box-shadow: inset 0px 4px 0px rgba(255, 255, 255, 0.5), 0 6px 15px rgba(0,0,0,0.15);
        }

        /* =========================================
           BOTÃO FLUTUANTE DE SOM DO VÍDEO
           ========================================= */
        .btn-som {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 50px;
            height: 50px;
            background: linear-gradient(180deg, #F8A9CD 0%, #E381B1 100%);
            border: 2px solid #D16B9E;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: white;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            z-index: 1000;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        @keyframes pulsar {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(227, 129, 177, 0.7); }
            70% { transform: scale(1.1); box-shadow: 0 0 0 10px rgba(227, 129, 177, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(227, 129, 177, 0); }
        }

        /* =========================================
           TELA POP-UP DE PRESENTES
           ========================================= */
        .tela-pop-up {
            display: none; 
            position: fixed; 
            top: 0;
            left: 50%;
            transform: translateX(-50%); 
            width: 100%;
            max-width: 450px; 
            height: 100vh;
            height: 100dvh; 
            background-color: #F8EAFB;
            background-image: url('presentes.png');
            background-size: contain;
            background-position: center;
            background-repeat: no-repeat;
            z-index: 999; 
            flex-direction: column;
            justify-content: space-between; 
            align-items: center;
            padding: 30px 20px 40px 20px; 
            box-sizing: border-box;
            box-shadow: 0 0 20px rgba(0,0,0,0.3);
            overflow-y: auto;
        }

        .titulo-presentes {
            font-size: 24px;
            font-weight: 900;
            color: #D16B9E;
            text-shadow: 1px 1px 2px rgba(255,255,255,0.8);
            text-align: center;
            margin-top: 15px;
        }

        .opcoes-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            align-items: center;
            margin: auto 0; 
        }

        .item-sugestao {
            background: rgba(255, 255, 255, 0.85);
            border: 2px dashed #E381B1;
            border-radius: 20px;
            padding: 12px 20px;
            width: 90%;
            max-width: 320px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
            box-sizing: border-box;
        }

        .item-sugestao h3 {
            margin: 0 0 5px 0;
            color: #7A5230;
            font-size: 16px;
        }

        .item-sugestao p {
            margin: 0;
            color: #555555;
            font-size: 14px;
            font-weight: bold;
        }

        .bloco-pix {
            background: rgba(255, 255, 255, 0.9);
            border: 2px solid #94CEF6;
            border-radius: 20px;
            padding: 12px;
            width: 90%;
            max-width: 320px;
            text-align: center;
            box-sizing: border-box;
        }

        .bloco-pix h3 {
            margin: 0 0 8px 0;
            color: #3A6B8C;
            font-size: 16px;
        }

        .qrcode-img {
            width: 110px;
            height: 110px;
            object-fit: contain;
            background-color: #FFF;
            border: 1px solid #ddd;
            border-radius: 10px;
            margin: 5px 0;
        }

        .chave-pix {
            font-size: 11px;
            color: #666;
            word-break: break-all;
            margin-top: 5px;
        }

        .botao-voltar {
            background: linear-gradient(180deg, #FFFFFF 0%, #F0F0F0 100%);
            border: 3px solid #D0D0D0;
            color: #777777;
            text-shadow: none;
            box-shadow: inset 0px 4px 0px rgba(255, 255, 255, 0.8), 0 6px 15px rgba(0,0,0,0.15);
            width: 60%;
            max-width: 250px;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <!-- BOTÃO FLUTUANTE DE SOM -->
    <div class="btn-som" id="btnSom" onclick="alternarSom(event)">
        🔇
    </div>

    <div class="container" id="areaPrincipal">
        
        <!-- 1. VÍDEO NO TOPO (PREENCHENDO DE PONTA A PONTA) -->
        <div class="secao-video">
            <video id="videoConvite" autoplay loop muted playsinline>
                <source src="videoconvite.mp4" type="video/mp4">
                Seu navegador não suporta vídeos.
            </video>
        </div>

        <!-- 2. IMAGEM DO CONVITE INTEIRA LOGO ABAIXO -->
        <div class="secao-imagem"></div>

        <!-- 3. SEÇÃO DOS BOTÕES -->
        <div class="secao-botoes">
            <a href="https://maps.app.goo.gl/QPDeiXmRhmCAj9Zy6" target="_blank" class="botao botao-mapa">
                Como Chegar
            </a>

            <a href="[https://wa.me/558896650938?text=confirmo%20presença](https://wa.me/558896650938?text=confirmo%20presença)" target="_blank" class="botao botao-presenca">
                Confirmar Presença
            </a>

            <a href="#" onclick="abrirPresentes(event)" class="botao-presentes botao">
                Lista de Presentes
            </a>
        </div>
    </div>

    <!-- TELA POP-UP DE PRESENTES -->
    <div class="tela-pop-up" id="telaPresentes">
        <div class="titulo-presentes">✨ Sugestão de Presentes ✨</div>

        <div class="opcoes-container">
            <div class="item-sugestao">
                <h3>👗 Roupinhas</h3>
                <p>Tamanho: 4 Anos</p>
            </div>

            <div class="item-sugestao">
                <h3>👟 Calçados</h3>
                <p>Tamanho: 23 / 24</p>
            </div>

            <div class="bloco-pix">
                <h3>🎁 Presente via Pix</h3>
                <img src="qrcode.png" alt="QR Code Pix" class="qrcode-img">
                <div class="chave-pix">Chave Pix: 84 9 2145 2008</div>
            </div>
        </div>

        <a href="#" onclick="fecharPresentes(event)" class="botao botao-voltar">
            ⬅️ Voltar
        </a>
    </div>

    <!-- SCRIPTS -->
    <script>
        // Lógica de presentes
        function abrirPresentes(event) {
            event.preventDefault(); 
            document.getElementById('telaPresentes').style.display = 'flex'; 
        }

        function fecharPresentes(event) {
            event.preventDefault(); 
            document.getElementById('telaPresentes').style.display = 'none'; 
        }

        // Lógica do Som do Vídeo
        const video = document.getElementById("videoConvite");
        const btnSom = document.getElementById("btnSom");

        function alternarSom(event) {
            if (event) {
                event.preventDefault(); // Impede qualquer comportamento padrão indesejado do navegador mobile
                event.stopPropagation(); // Evita que o clique passe para elementos de trás
            }
            
            if (video.muted) {
                video.muted = false; 
                video.play(); // Garante que o vídeo continue rodando perfeitamente ao ligar o som
                btnSom.innerHTML = "🔊"; 
                btnSom.style.animation = "pulsar 2s infinite"; 
            } else {
                video.muted = true; 
                btnSom.innerHTML = "🔇"; 
                btnSom.style.animation = "none"; 
            }
        }

        // Liga o som automaticamente no primeiro clique/toque em qualquer lugar da tela
        document.body.addEventListener('click', function() {
            if (video.muted) {
                video.muted = false;
                video.play();
                btnSom.innerHTML = "🔊";
                btnSom.style.animation = "pulsar 2s infinite";
            }
        }, { once: true });
        
        document.body.addEventListener('touchstart', function() {
            if (video.muted) {
                video.muted = false;
                video.play();
                btnSom.innerHTML = "🔊";
                btnSom.style.animation = "pulsar 2s infinite";
            }
        }, { once: true });
    </script>

</body>
</html>
